                                            <td className="px-4 py-5 text-right bg-gray-200 text-black text-[17px]">{formatCurrency(runningBalanceA + runningBalanceB)}</td>
                                            <td className="bg-gray-100 border-none no-pdf"></td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen pb-10 font-sans">
                    <div className="max-w-[1500px] mx-auto p-4 sm:p-6 space-y-6">
                        <header className="bg-white rounded-2xl shadow-sm overflow-hidden no-pdf border border-gray-200">
                            <div className="p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
                                <div className="flex items-center gap-4">
                                    <div className="w-12 h-12 bg-black text-white rounded-xl flex items-center justify-center font-black text-xl shadow-lg shadow-black/20">M</div>
                                    <div>
                                        <h1 className="text-2xl font-black text-gray-900 tracking-tight">Tablero de Proveedores <span className="px-2 py-1 bg-fuchsia-100 text-fuchsia-800 text-[10px] rounded uppercase tracking-widest ml-2 align-middle">Pro</span></h1>
                                        <p className="text-gray-500 text-sm mt-1 font-medium">Consolidado y Libro Diario de Cuentas Corrientes</p>
                                    </div>
                                </div>
                                <div className="flex flex-col items-end gap-2">
                                    <div className="flex items-center gap-1.5 text-[10px] font-bold text-gray-600 bg-gray-100 px-2.5 py-1 rounded-full uppercase tracking-wider border border-gray-200">
                                        <Icon name="database" size={12}/> Guardado Local Seguro
                                    </div>
                                    <div className="bg-gray-50 px-5 py-2.5 rounded-xl text-right border border-gray-200">
                                        <p className="text-[10px] text-gray-400 uppercase font-black tracking-widest">Fecha Operativa</p>
                                        <p className="font-black text-black text-lg">{formatDate(FECHA_ACTUAL.toISOString())}</p>
                                    </div>
                                </div>
                            </div>
                        </header>

                        <main id="pdf-export-area" className="transition-all duration-300 relative">
                            {currentView === 'main' && <DashboardView />}
                            {currentView === 'details' && <DetailsView />}
                        </main>
                    </div>

                    {overdueList.length > 0 && (
                        <div className="fixed bottom-6 right-6 z-50 no-pdf fade-in">
                            <button onClick={() => setIsAlertsOpen(!isAlertsOpen)} className="bg-red-600 hover:bg-red-700 text-white p-4 rounded-full shadow-[0_10px_25px_rgba(220,38,38,0.5)] relative transition-all">
                                <Icon name="bell" />
                                <span className="absolute -top-2 -right-2 bg-black text-white text-[10px] font-black w-6 h-6 rounded-full flex items-center justify-center border-2 border-white">{overdueList.reduce((acc, p)=>acc+p.count, 0)}</span>
                            </button>
                            {isAlertsOpen && (
                                <div className="absolute bottom-16 right-0 w-80 bg-white rounded-2xl shadow-2xl border border-gray-200 overflow-hidden fade-in">
                                    <div className="bg-red-600 px-5 py-4 flex justify-between items-center text-white">
                                        <h4 className="font-black flex items-center gap-2"><Icon name="alert" size={18}/> Alertas de Vencimiento</h4>
                                    </div>
                                    <div className="max-h-80 overflow-y-auto divide-y divide-gray-100">
                                        {overdueList.map(p => (
                                            <div key={p.id} className="p-4 hover:bg-red-50/50 transition-colors cursor-pointer" onClick={() => { setSelectedProviderId(p.id); setCurrentView('details'); setIsAlertsOpen(false); }}>
                                                <div className="flex justify-between items-start">
                                                    <span className="font-black text-gray-900 text-sm">{p.name}</span>
                                                    <span className="text-[10px] bg-red-100 text-red-600 font-bold px-2 py-0.5 rounded uppercase tracking-wider">{p.count} Fac.</span>
                                                </div>
                                                <p className="text-xs text-gray-500 mt-1">Registra deuda atrasada por <strong className="text-red-500">{formatCurrency(p.amount)}</strong>.</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {confirmDialog.isOpen && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[200] p-4 fade-in no-pdf">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8 text-center border border-gray-200">
                                <div className="mx-auto w-14 h-14 bg-red-50 text-red-600 rounded-full flex items-center justify-center mb-5"><Icon name="alert" size={28}/></div>
                                <h3 className="text-xl font-black text-gray-900 mb-2">¿Estás seguro?</h3>
                                <p className="text-gray-500 text-sm mb-8 font-medium">{confirmDialog.message}</p>
                                <div className="flex gap-3 justify-center">
                                    <button onClick={() => setConfirmDialog({ isOpen: false })} className="flex-1 px-4 py-3 border border-gray-300 rounded-xl text-gray-700 font-bold">Cancelar</button>
                                    <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog({ isOpen: false }); }} className="flex-1 px-4 py-3 bg-red-600 text-white rounded-xl font-bold">Confirmar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {pdfConfig.isOpen && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[200] p-4 fade-in no-pdf">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 border border-gray-200">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xl font-black text-gray-900 flex items-center gap-2"><Icon name="download"/> Reporte PDF</h3>
                                    <button onClick={() => setPdfConfig({ isOpen: false })} className="text-gray-400 hover:bg-gray-100 p-2 rounded-full"><Icon name="x"/></button>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <button onClick={() => executePDFExport('portrait')} className="border-2 border-gray-200 hover:border-black rounded-xl p-5 flex flex-col items-center gap-4 group">
                                        <span className="font-bold text-gray-700 group-hover:text-black">Vertical</span>
                                    </button>
                                    <button onClick={() => executePDFExport('landscape')} className="border-2 border-gray-200 hover:border-black rounded-xl p-5 flex flex-col items-center gap-4 group">
                                        <span className="font-bold text-gray-700 group-hover:text-black">Horizontal</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
